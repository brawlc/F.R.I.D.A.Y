<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FRIDAY Gesture Cursor</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #07090d;
        color: #e6edf3;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at top left, rgba(41, 121, 255, 0.22), transparent 32rem), #07090d;
      }

      main {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 18px;
        min-height: 100vh;
        padding: 18px;
      }

      .stage {
        position: relative;
        overflow: hidden;
        min-height: calc(100vh - 36px);
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: #020617;
      }

      video,
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      video {
        opacity: 0;
      }

      aside {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 18px;
        border: 1px solid rgba(148, 163, 184, 0.24);
        border-radius: 8px;
        background: rgba(15, 23, 42, 0.92);
      }

      h1 {
        margin: 0;
        font-size: 22px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #9fb0c4;
        line-height: 1.5;
      }

      button {
        width: 100%;
        min-height: 42px;
        border: 1px solid rgba(125, 211, 252, 0.45);
        border-radius: 6px;
        background: #0f172a;
        color: #f8fafc;
        font: inherit;
        cursor: pointer;
      }

      button.primary {
        background: #0ea5e9;
        color: #00131f;
        font-weight: 700;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      label {
        display: grid;
        gap: 8px;
        color: #cbd5e1;
        font-size: 13px;
      }

      input[type="range"] {
        width: 100%;
      }

      .readout {
        display: grid;
        gap: 8px;
        padding: 12px;
        border: 1px solid rgba(148, 163, 184, 0.18);
        border-radius: 6px;
        background: rgba(2, 6, 23, 0.5);
        color: #cbd5e1;
        font-size: 13px;
      }

      .dot {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;
        border-radius: 999px;
        background: #64748b;
      }

      .dot.on {
        background: #22c55e;
      }

      .hint {
        font-size: 13px;
      }

      @media (max-width: 840px) {
        main {
          grid-template-columns: 1fr;
        }

        .stage {
          min-height: 58vh;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="stage" aria-label="Camera tracking preview">
        <video id="video" playsinline></video>
        <canvas id="canvas"></canvas>
      </section>
      <aside>
        <h1>Gesture Cursor</h1>
        <p>Move your hand to steer the cursor. Pinch your thumb and index finger for a left click.</p>
        <button id="start" class="primary" type="button">Start Camera Control</button>
        <button id="stop" type="button" disabled>Stop</button>
        <label>
          <span><input id="directMap" type="checkbox" checked /> Direct desktop map</span>
        </label>
        <label>
          <span><input id="mirrorX" type="checkbox" /> Invert left/right</span>
        </label>
        <label>
          Pointer smoothing
          <input id="smoothing" type="range" min="0" max="0.9" step="0.05" value="0" />
        </label>
        <label>
          Movement speed
          <input id="gain" type="range" min="0.45" max="1.35" step="0.05" value="0.85" />
        </label>
        <label>
          Edge reach
          <input id="margin" type="range" min="0" max="0.35" step="0.01" value="0.18" />
        </label>
        <label>
          Jitter guard
          <input id="deadzone" type="range" min="0" max="0.035" step="0.0025" value="0" />
        </label>
        <div class="readout">
          <div><span id="cameraDot" class="dot"></span><span id="cameraStatus">Camera idle</span></div>
          <div><span id="handDot" class="dot"></span><span id="handStatus">No hand detected</span></div>
          <div id="cursorStatus">Cursor bridge waiting</div>
        </div>
        <p class="hint">Use this only from the local FRIDAY desktop app or localhost. Keep your palm facing the camera for steadier tracking.</p>
      </aside>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script>
      const video = document.getElementById('video');
      const canvas = document.getElementById('canvas');
      const context = canvas.getContext('2d');
      const startButton = document.getElementById('start');
      const stopButton = document.getElementById('stop');
      const directMapInput = document.getElementById('directMap');
      const mirrorXInput = document.getElementById('mirrorX');
      const smoothingInput = document.getElementById('smoothing');
      const gainInput = document.getElementById('gain');
      const marginInput = document.getElementById('margin');
      const deadzoneInput = document.getElementById('deadzone');
      const cameraDot = document.getElementById('cameraDot');
      const handDot = document.getElementById('handDot');
      const cameraStatus = document.getElementById('cameraStatus');
      const handStatus = document.getElementById('handStatus');
      const cursorStatus = document.getElementById('cursorStatus');

      let camera = null;
      let running = false;
      let smoothed = null;
      let lastSentAt = 0;
      let pinched = false;

      function setStatus(element, dot, text, active) {
        element.textContent = text;
        dot.classList.toggle('on', active);
      }

      function fitCanvas() {
        const width = canvas.clientWidth || 1280;
        const height = canvas.clientHeight || 720;
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
        }
      }

      function expandFromCenter(value, gain) {
        return Math.min(1, Math.max(0, 0.5 + (value - 0.5) * gain));
      }

      function clamp01(value) {
        return Math.min(1, Math.max(0, value));
      }

      function mapCameraToPointer(value, margin) {
        if (margin <= 0) return Math.min(1, Math.max(0, value));
        return Math.min(1, Math.max(0, (value - margin) / (1 - margin * 2)));
      }

      function getHandCenter(landmarks) {
        const palmPoints = [0, 5, 9, 13, 17]
          .map(index => landmarks[index])
          .filter(Boolean);
        if (!palmPoints.length) return landmarks[8];

        return {
          x: palmPoints.reduce((sum, point) => sum + point.x, 0) / palmPoints.length,
          y: palmPoints.reduce((sum, point) => sum + point.y, 0) / palmPoints.length,
        };
      }

      async function sendCursor(x, y, action = 'move') {
        const now = performance.now();
        if (action === 'move' && now - lastSentAt < 33) return;
        lastSentAt = now;

        try {
          const response = await fetch('/api/desktop/cursor', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ x, y, action }),
          });
          if (response.ok) {
            cursorStatus.textContent = `Cursor ${action}`;
          } else {
            const result = await response.json().catch(() => null);
            cursorStatus.textContent = result?.message || 'Cursor bridge blocked';
          }
        } catch {
          cursorStatus.textContent = 'Cursor bridge offline';
        }
      }

      async function checkDesktopBridge() {
        try {
          const response = await fetch('/api/desktop/status');
          const result = await response.json();
          cursorStatus.textContent = result.desktopBridge
            ? 'Cursor bridge ready'
            : 'Open this from FRIDAY desktop for whole-desktop cursor control';
        } catch {
          cursorStatus.textContent = 'Cursor bridge offline';
        }
      }

      function onResults(results) {
        fitCanvas();
        context.save();
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(results.image, 0, 0, canvas.width, canvas.height);

        const landmarks = results.multiHandLandmarks?.[0];
        if (!landmarks) {
          setStatus(handStatus, handDot, 'No hand detected', false);
          context.restore();
          return;
        }

        setStatus(handStatus, handDot, 'Hand locked', true);
        window.drawConnectors?.(context, landmarks, window.HAND_CONNECTIONS, { color: '#38bdf8', lineWidth: 3 });
        window.drawLandmarks?.(context, landmarks, { color: '#f8fafc', lineWidth: 1, radius: 3 });

        const handCenter = getHandCenter(landmarks);
        const index = landmarks[8];
        const thumb = landmarks[4];
        const gain = Number(gainInput.value);
        const smoothing = Number(smoothingInput.value);
        const margin = Number(marginInput.value);
        const deadzone = Number(deadzoneInput.value);
        const rawX = mirrorXInput.checked ? 1 - handCenter.x : handCenter.x;
        const rawY = handCenter.y;
        const target = directMapInput.checked
          ? {
              x: mapCameraToPointer(rawX, margin),
              y: mapCameraToPointer(rawY, margin),
            }
          : {
              x: expandFromCenter(mapCameraToPointer(rawX, margin), gain),
              y: expandFromCenter(mapCameraToPointer(rawY, margin), gain),
            };

        if (smoothed && Math.hypot(target.x - smoothed.x, target.y - smoothed.y) < deadzone) {
          target.x = smoothed.x;
          target.y = smoothed.y;
        }

        smoothed = smoothed
          ? {
              x: smoothed.x * smoothing + target.x * (1 - smoothing),
              y: smoothed.y * smoothing + target.y * (1 - smoothing),
            }
          : target;

        const dx = thumb.x - index.x;
        const dy = thumb.y - index.y;
        const pinchDistance = Math.hypot(dx, dy);
        const isPinching = pinchDistance < 0.052;

        sendCursor(smoothed.x, smoothed.y, isPinching && !pinched ? 'click' : 'move');
        pinched = isPinching;

        const pointerX = rawX * canvas.width;
        const pointerY = rawY * canvas.height;
        context.beginPath();
        context.arc(pointerX, pointerY, isPinching ? 18 : 12, 0, Math.PI * 2);
        context.strokeStyle = isPinching ? '#22c55e' : '#facc15';
        context.lineWidth = 4;
        context.stroke();
        context.restore();
      }

      async function start() {
        if (running) return;
        if (!window.Hands || !window.Camera) {
          cursorStatus.textContent = 'Hand tracking library did not load';
          return;
        }

        const hands = new window.Hands({
          locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
        });
        hands.setOptions({
          maxNumHands: 1,
          modelComplexity: 1,
          minDetectionConfidence: 0.68,
          minTrackingConfidence: 0.62,
        });
        hands.onResults(onResults);

        camera = new window.Camera(video, {
          onFrame: async () => {
            if (running) await hands.send({ image: video });
          },
          width: 1280,
          height: 720,
        });

        running = true;
        try {
          await camera.start();
          setStatus(cameraStatus, cameraDot, 'Camera active', true);
          startButton.disabled = true;
          stopButton.disabled = false;
          await checkDesktopBridge();
        } catch (error) {
          running = false;
          camera = null;
          setStatus(cameraStatus, cameraDot, 'Camera blocked', false);
          cursorStatus.textContent = error?.message || 'Camera permission failed';
        }
      }

      async function stop() {
        running = false;
        smoothed = null;
        pinched = false;
        camera?.stop();
        camera = null;
        context.clearRect(0, 0, canvas.width, canvas.height);
        setStatus(cameraStatus, cameraDot, 'Camera idle', false);
        setStatus(handStatus, handDot, 'No hand detected', false);
        cursorStatus.textContent = 'Cursor bridge waiting';
        startButton.disabled = false;
        stopButton.disabled = true;
      }

      startButton.addEventListener('click', () => void start());
      stopButton.addEventListener('click', () => void stop());
      window.addEventListener('resize', fitCanvas);
      fitCanvas();
      checkDesktopBridge();
    </script>
  </body>
</html>
